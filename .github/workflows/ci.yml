name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.21"
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --dev

      - name: Check Python formatting
        run: uv run ruff format --check backend ml scripts

      - name: Lint contracts and Python
        run: |
          python3 -B scripts/validate_phase0.py
          python3 -B scripts/validate_phase2.py
          python3 -B scripts/validate_phase3.py
          python3 -B scripts/validate_phase4.py
          python3 -B scripts/validate_phase5.py
          python3 -B scripts/validate_phase6.py
          python3 -B scripts/validate_phase7.py
          python3 -B scripts/validate_phase8.py
          uv run ruff check backend ml scripts

      - name: Type-check Python
        run: uv run mypy

      - name: Test Python
        run: uv run pytest backend/tests ml/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Check frontend formatting
        run: npm --prefix frontend run format:check

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Type-check frontend
        run: npm --prefix frontend run typecheck

      - name: Test frontend
        run: npm --prefix frontend test

      - name: Build frontend
        run: npm --prefix frontend run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet
